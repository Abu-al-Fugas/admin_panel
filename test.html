<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1976d2">
<title>Заявка на счетчик</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f4f6f8;
    color: #222;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 20px;
    color: #1976d2;
    text-align: center;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }
  label .req { color: #e53935; }
  input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cfd8dc;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 16px;
    background: #fafafa;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #1976d2;
    background: #fff;
  }
  input[type="file"] {
    padding: 8px;
    background: #fff;
  }
  .geo-status {
    font-size: 13px;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    background: #fff3e0;
    color: #e65100;
    border: 1px solid #ffe0b2;
  }
  .geo-status.ok {
    background: #e8f5e9;
    color: #2e7d32;
    border-color: #c8e6c9;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: #25D366;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:active { transform: scale(0.98); }
  button:disabled {
    background: #b0bec5;
    cursor: not-allowed;
  }
  .preview {
    display: none;
    margin-top: 16px;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 8px;
    font-size: 13px;
    white-space: pre-wrap;
    color: #555;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🔧 Заявка на газовый счетчик</h1>

  <form id="requestForm">
    <label>Адрес объекта <span class="req">*</span></label>
    <input type="text" id="address" placeholder="Город, улица, дом, кв." required>

    <label>Номер телефона <span class="req">*</span></label>
    <input type="tel" id="phone" placeholder="+7 999 123-45-67" required>

    <label>Модель счетчика <span class="req">*</span></label>
    <input type="text" id="meterModel" placeholder="Например: BK-G10" required>

    <label>Фото (шильдик + место установки) <span class="req">*</span></label>
    <input type="file" id="photo" accept="image/*" capture="environment" required>

    <label>Местоположение (автоматически)</label>
    <div id="geoStatus" class="geo-status">📍 Определяем координаты...</div>
    <input type="hidden" id="coords" required>

    <button type="submit" id="submitBtn">Отправить в WhatsApp</button>
  </form>

  <div class="preview" id="preview"></div>
</div>

<script>
// --- 1. АВТОМАТИЧЕСКОЕ ОПРЕДЕЛЕНИЕ ГЕОЛОКАЦИИ ---
const geoStatus = document.getElementById('geoStatus');
const coordsInput = document.getElementById('coords');
let currentCoords = null;

function updateGeoStatus(text, ok = false) {
  geoStatus.textContent = text;
  geoStatus.classList.toggle('ok', ok);
}

if ('geolocation' in navigator) {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      currentCoords = {
        lat: pos.coords.latitude.toFixed(6),
        lon: pos.coords.longitude.toFixed(6)
      };
      coordsInput.value = `${currentCoords.lat},${currentCoords.lon}`;
      updateGeoStatus(`✅ Координаты получены: ${currentCoords.lat}, ${currentCoords.lon}`, true);
    },
    (err) => {
      updateGeoStatus('⚠️ Не удалось получить геолокацию. Разрешите доступ в браузере.', false);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
} else {
  updateGeoStatus('❌ Геолокация не поддерживается устройством.', false);
}

// --- 2. ОТПРАВКА В WHATSAPP ---
const form = document.getElementById('requestForm');
const preview = document.getElementById('preview');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const address = document.getElementById('address').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const meterModel = document.getElementById('meterModel').value.trim();
  const photoFile = document.getElementById('photo').files[0];

  if (!currentCoords) {
    alert('Дождитесь определения координат или разрешите доступ к геолокации.');
    return;
  }
  if (!photoFile) {
    alert('Прикрепите фото.');
    return;
  }

  // Формируем красивое сообщение
  const googleMapsLink = `https://maps.google.com/?q=${currentCoords.lat},${currentCoords.lon}`;
  const message =
`🔧 *НОВАЯ ЗАЯВКА*
━━━━━━━━━━━━━━━
📍 *Адрес:* ${address}
📞 *Телефон:* ${phone}
⚙️ *Счетчик:* ${meterModel}
🗺 *Геолокация:* ${googleMapsLink}
🕒 *Время:* ${new Date().toLocaleString('ru-RU')}
━━━━━━━━━━━━━━━
📷 Фото прикреплено отдельно ниже.`;

  // Показываем превью
  preview.style.display = 'block';
  preview.textContent = message;

  // Копируем текст в буфер (чтобы работник просто вставил)
  try {
    await navigator.clipboard.writeText(message);
  } catch (err) {
    console.warn('Не удалось скопировать в буфер', err);
  }

  // Открываем WhatsApp с предзаполненным текстом
  const waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
  window.open(waUrl, '_blank');

  // Небольшая подсказка
  alert('Текст скопирован! В WhatsApp вставьте его в группу и прикрепите фото вручную.');
});
</script>

</body>
</html>
